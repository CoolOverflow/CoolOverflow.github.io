<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>打砖块 · 游戏厅 | cooloverflow</title>
  <meta name="description" content="浏览器里直接玩的打砖块：鼠标 / 触屏 / 方向键控制挡板，5 排霓虹砖块、6 个关卡、3 条命，带粒子与连击反馈。纯前端 Canvas 实现。">
  <meta name="theme-color" content="#0B0F14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F14'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%23FFC857'/%3E%3C/svg%3E">
  <link rel="canonical" href="https://cooloverflow.github.io/games/breakout/">
  <link rel="stylesheet" href="../_shared/game-shell.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-shell" data-game="breakout">
  <header class="shell-topbar">
    <a class="shell-back" href="../../">
      <span class="shell-back-arrow" aria-hidden="true">←</span>
      <span class="shell-back-label">返回博客</span>
    </a>
    <div class="shell-title">
      <h1>打砖块</h1>
      <p class="shell-sub">Neon Breakout · Canvas</p>
    </div>
    <div class="shell-actions">
      <button class="shell-btn" type="button" data-action="pause" title="暂停 / 继续（空格）">暂停</button>
      <button class="shell-btn" type="button" data-action="restart" title="重新开始（R）">重开</button>
      <button class="shell-btn shell-btn--icon" type="button" data-action="fullscreen" title="全屏" aria-label="全屏">⛶</button>
    </div>
  </header>

  <main class="shell-main">
    <div class="shell-hud">
      <div class="shell-stat shell-stat--accent">
        <span class="shell-stat-label">分数</span>
        <strong class="shell-stat-value" data-score>0</strong>
      </div>
      <div class="shell-stat shell-stat--dim">
        <span class="shell-stat-label">最高分</span>
        <strong class="shell-stat-value" data-best>0</strong>
      </div>
      <div class="shell-stat">
        <span class="shell-stat-label">生命</span>
        <strong class="shell-stat-value" data-lives>3</strong>
      </div>
      <div class="shell-stat">
        <span class="shell-stat-label">关卡</span>
        <strong class="shell-stat-value" data-level>1 / 6</strong>
      </div>
    </div>

    <div class="shell-stage-area">
      <div class="shell-stage stage-breakout" data-stage>
        <canvas class="shell-canvas" data-canvas aria-label="打砖块游戏画面"></canvas>
        <div class="shell-overlay" data-overlay>
          <div class="shell-card">
            <span class="shell-card-kicker" data-overlay-kicker>Ready</span>
            <h2 data-overlay-title>打砖块</h2>
            <p data-overlay-text>按空格或点「开始」发球。移动鼠标 / 手指控制挡板，键盘 ← → 也可以。清空砖块进入下一关，共 6 关。</p>
            <div class="shell-card-actions">
              <button class="shell-btn shell-btn--primary" type="button" data-overlay-primary>开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="shell-hint">
      <span class="hint-item key-only"><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移动挡板</span>
      <span class="hint-item touch-only">拖动手指移动挡板</span>
      <span class="hint-item"><kbd>空格</kbd> 发球 / 暂停</span>
      <span class="hint-item"><kbd>R</kbd> 重开</span>
      <span class="hint-item">挡板边缘反弹角度更刁</span>
    </p>
    <p class="shell-rotate-tip">建议横屏游玩，体验更佳</p>
  </main>

  <script src="logic.classic.js"></script>
  <script src="../_shared/game-shell.js"></script>
  <script src="game.js"></script>
</body>
</html>
