<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>贪吃蛇 · Amuda</title>
  <meta name="description" content="在浏览器里直接玩的贪吃蛇：方向键 / WASD / 触屏滑动控制，支持暂停、加速、最高分记录。纯前端 Canvas 实现，无需安装。">
  <meta name="theme-color" content="#0B0F14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F14'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%237CFFB2'/%3E%3C/svg%3E">
  <link rel="canonical" href="https://cooloverflow.github.io/games/snake/">
  <link rel="stylesheet" href="../_shared/game-shell.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-shell" data-game="snake">
  <header class="shell-topbar">
    <a class="shell-back" href="/games/">
      <span class="shell-back-arrow" aria-hidden="true">←</span>
      <span class="shell-back-label">返回游戏厅</span>
    </a>
    <div class="shell-title">
      <h1>贪吃蛇</h1>
      <p class="shell-sub">Neon Snake · Canvas</p>
    </div>
    <div class="shell-actions">
      <button class="shell-btn" type="button" data-action="speed" title="切换速度">速度 ×1</button>
      <button class="shell-btn" type="button" data-action="pause" title="暂停 / 继续（空格）">暂停</button>
      <button class="shell-btn" type="button" data-action="restart" title="重新开始（R）">重开</button>
      <button class="shell-btn shell-btn--icon" type="button" data-action="fullscreen" title="全屏" aria-label="全屏">⛶</button>
    </div>
  </header>

  <main class="shell-main">
    <div class="shell-hud">
      <div class="shell-stat shell-stat--accent">
        <span class="shell-stat-label">分数</span>
        <strong class="shell-stat-value" data-score>0</strong>
      </div>
      <div class="shell-stat shell-stat--dim">
        <span class="shell-stat-label">最高分</span>
        <strong class="shell-stat-value" data-best>0</strong>
      </div>
      <div class="shell-stat">
        <span class="shell-stat-label">长度</span>
        <strong class="shell-stat-value" data-length>4</strong>
      </div>
      <div class="shell-stat">
        <span class="shell-stat-label">速度</span>
        <strong class="shell-stat-value" data-speed>×1</strong>
      </div>
    </div>

    <div class="shell-stage-area">
      <div class="shell-stage" data-stage>
        <canvas class="shell-canvas" data-canvas aria-label="贪吃蛇游戏画面"></canvas>
        <div class="shell-overlay" data-overlay>
          <div class="shell-card" data-overlay-card>
            <span class="shell-card-kicker" data-overlay-kicker>Ready</span>
            <h2 data-overlay-title>2</h2>
            <p data-overlay-text>方向键 / WASD 转向，空格暂停。吃到方形能量块会变长。</p>
            <div class="shell-card-actions">
              <button class="shell-btn shell-btn--primary" type="button" data-overlay-primary>立即开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="shell-hint">
      <span class="hint-item key-only"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 转向</span>
      <span class="hint-item touch-only">在棋盘上滑动转向</span>
      <span class="hint-item"><kbd>空格</kbd> 暂停 / 继续</span>
      <span class="hint-item"><kbd>R</kbd> 重开</span>
      <span class="hint-item">不要撞墙，也别咬到自己</span>
    </p>
    <p class="shell-rotate-tip">建议横屏游玩，体验更佳</p>
  </main>

  <script src="logic.classic.js"></script>
  <script src="../_shared/game-shell.js"></script>
  <script src="game.js"></script>
</body>
</html>
